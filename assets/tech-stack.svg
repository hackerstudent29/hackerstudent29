      <g transform="translate(564, 0)">
        <rect width="84" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="42" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">AWS RDS</text>
      </g>
