        <rect width="66" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="33" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Redis</text>
      </g>
      <!-- Supabase -->
      <g transform="translate(282, 0)">
        <rect width="86" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="43" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Supabase</text>
      </g>
      <!-- Prisma ORM -->
      <g transform="translate(376, 0)">
        <rect width="98" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="49" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Prisma ORM</text>
      </g>
      <!-- Docker -->
      <g transform="translate(482, 0)">
        <rect width="74" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="37" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Docker</text>
      </g>
