        <text x="39" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFCCD5" text-anchor="middle">FastAPI</text>
      </g>
      <!-- Fastify -->
      <g transform="translate(298, 0)">
        <rect width="76" height="26" rx="10" fill="url(#pillClay)" stroke="#FF2A54" stroke-width="1.2" stroke-opacity="0.5" filter="url(#clayPillShadow)"/>
        <text x="38" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFCCD5" text-anchor="middle">Fastify</text>
      </g>
      <!-- Node.js -->
      <g transform="translate(382, 0)">
        <rect width="78" height="26" rx="10" fill="url(#pillClay)" stroke="#FF2A54" stroke-width="1.2" stroke-opacity="0.5" filter="url(#clayPillShadow)"/>
        <text x="39" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFCCD5" text-anchor="middle">Node.js</text>
