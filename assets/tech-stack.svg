        <text x="58" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFCCD5" text-anchor="middle">ExoPlayer DSP</text>
      </g>
    </g>

    <!-- Group 4: Data & Cloud (y: 188) -->
    <g transform="translate(36, 188)">
      <text x="0" y="18" class="font-mono" font-size="10.5" font-weight="700" fill="#E8A598" letter-spacing="1">DATA &amp; INFRA:</text>

      <!-- PostgreSQL -->
      <g transform="translate(100, 0)">
        <rect width="100" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="50" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">PostgreSQL</text>
      </g>
      <!-- Redis -->
