        <text x="39" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Next.js</text>
      </g>
      <!-- Flutter 3 -->
      <g transform="translate(278, 0)">
        <rect width="84" height="26" rx="10" fill="url(#pillClay)" stroke="#FF2A54" stroke-width="1.2" stroke-opacity="0.5" filter="url(#clayPillShadow)"/>
        <text x="42" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFCCD5" text-anchor="middle">Flutter 3</text>
      </g>
      <!-- Tailwind CSS -->
      <g transform="translate(370, 0)">
        <rect width="102" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="51" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Tailwind CSS</text>
      </g>
      <!-- Three.js -->
      <g transform="translate(480, 0)">
        <rect width="82" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="41" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Three.js</text>
