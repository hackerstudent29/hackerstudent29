<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" fill="none">
  <defs>
    <linearGradient id="stackCardBg" x1="0" y1="0" x2="920" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24131C"/>
      <stop offset="100%" stop-color="#190B13"/>
    </linearGradient>

    <linearGradient id="pillClay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A1E2E"/>
      <stop offset="100%" stop-color="#271420"/>
    </linearGradient>

    <filter id="clayPillShadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FF2A54" flood-opacity="0.15"/>
    </filter>

    <clipPath id="stackClip">
      <rect width="920" height="240" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <g clip-path="url(#stackClip)">
    <rect width="920" height="240" rx="22" fill="url(#stackCardBg)" stroke="#FF4D6D" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M 30 1 L 890 1" stroke="#FFF0F3" stroke-opacity="0.25" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Section Title & Badge -->
    <g transform="translate(36, 26)">
      <text x="0" y="16" class="font-sans" font-size="16" font-weight="900" fill="#FFF0F3" letter-spacing="1">
        ✦ THE CLAY TECH ARSENAL
      </text>
      <text x="250" y="15" class="font-mono" font-size="11" font-weight="500" fill="#FF758F">
        [ SYSTEM ARCHITECTURE &amp; FULL-STACK SUITE ]
      </text>
    </g>

    <!-- Group 1: Languages & Core (y: 62) -->
    <g transform="translate(36, 62)">
      <text x="0" y="18" class="font-mono" font-size="10.5" font-weight="700" fill="#E8A598" letter-spacing="1">LANGUAGES:</text>

      <!-- Java -->
      <g transform="translate(100, 0)">
        <rect width="66" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="33" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Java</text>
      </g>
      <!-- Python -->
      <g transform="translate(174, 0)">
        <rect width="78" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="39" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Python</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(260, 0)">
        <rect width="102" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="51" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">TypeScript</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(370, 0)">
        <rect width="96" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="48" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">JavaScript</text>
      </g>
      <!-- Kotlin -->
      <g transform="translate(474, 0)">
        <rect width="70" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="35" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Kotlin</text>
      </g>
      <!-- Dart -->
      <g transform="translate(552, 0)">
        <rect width="64" height="26" rx="10" fill="url(#pillClay)" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.35" filter="url(#clayPillShadow)"/>
        <text x="32" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#FFF0F3" text-anchor="middle">Dart</text>
