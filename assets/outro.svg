<svg xmlns="http://www.w3.org/2000/svg" width="920" height="160" viewBox="0 0 920 160" fill="none">
  <defs>
    <linearGradient id="outroBg" x1="0" y1="0" x2="920" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#26141F"/>
      <stop offset="50%" stop-color="#1E0E17"/>
      <stop offset="100%" stop-color="#14080F"/>
    </linearGradient>
    <linearGradient id="outroText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="60%" stop-color="#FFB3C1"/>
      <stop offset="100%" stop-color="#FF2A54"/>
    </linearGradient>
    <filter id="oShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="oClip"><rect width="920" height="160" rx="22"/></clipPath>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <g clip-path="url(#oClip)">
    <rect width="920" height="160" rx="22" fill="url(#outroBg)" stroke="#FF4D6D" stroke-opacity="0.35" stroke-width="1.5" filter="url(#oShadow)"/>
    <path d="M 24 1 L 896 1" stroke="#FFF0F3" stroke-opacity="0.25" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Left: Message -->
    <g transform="translate(40, 36)">
      <rect width="138" height="22" rx="11" fill="#3D1B2C" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.4"/>
      <text x="69" y="15" class="font-mono" font-size="9.5" font-weight="700" fill="#FFCCD5" text-anchor="middle">STAY CURIOUS · BUILD</text>

      <text x="0" y="54" class="font-sans" font-size="28" font-weight="900" fill="url(#outroText)" letter-spacing="-0.5">
        Let's create something dependable.
      </text>

      <text x="0" y="80" class="font-sans" font-size="13" font-weight="500" fill="#E8A598">
        Open to high-impact software engineering roles, backend systems, and AI/RAG collaborations.
      </text>
    </g>

    <!-- Right: City & Coordinates -->
    <g transform="translate(680, 48)">
      <text x="200" y="24" class="font-mono" font-size="11" font-weight="600" fill="#FF758F" text-anchor="end">CHENNAI, TAMIL NADU</text>
      <text x="200" y="44" class="font-mono" font-size="11" font-weight="400" fill="#C9A8B6" text-anchor="end">13.0827° N, 80.2707° E</text>
      <text x="200" y="66" class="font-mono" font-size="10.5" font-weight="500" fill="#2EC4B6" text-anchor="end">● AVAILABLE FOR HIRE</text>
    </g>
  </g>
</svg>