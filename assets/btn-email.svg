<svg xmlns="http://www.w3.org/2000/svg" width="200" height="46" viewBox="0 0 200 46" fill="none">
  <defs>
    <linearGradient id="btnClay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#351B2A"/>
      <stop offset="100%" stop-color="#23111C"/>
    </linearGradient>
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF2A54" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif; }
  </style>
  <rect x="2" y="2" width="196" height="40" rx="14" fill="url(#btnClay)" stroke="#FF4D6D" stroke-opacity="0.4" stroke-width="1.4" filter="url(#btnShadow)"/>
  <path d="M 16 3 L 184 3" stroke="#FFF0F3" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Mail Icon -->
  <g transform="translate(18, 13)">
    <rect width="20" height="15" rx="3.5" fill="#FF2A54" fill-opacity="0.2" stroke="#FF4D6D" stroke-width="1.3"/>
    <path d="M 2 3 L 10 9 L 18 3" stroke="#FFCCD5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="50" y="26" class="txt" font-size="12" font-weight="700" fill="#FFF0F3" letter-spacing="0.5">GET IN TOUCH</text>
  <text x="175" y="26" class="txt" font-size="13" font-weight="800" fill="#FF4D6D">→</text>
</svg>