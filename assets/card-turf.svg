<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" fill="none">
  <defs>
    <linearGradient id="cardTBg" x1="0" y1="0" x2="440" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#281521"/>
      <stop offset="100%" stop-color="#1B0C15"/>
    </linearGradient>
    <filter id="cShadowT" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF2A54" flood-opacity="0.15"/>
    </filter>
    <clipPath id="tClip"><rect width="440" height="210" rx="18"/></clipPath>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <g clip-path="url(#tClip)">
    <rect width="440" height="210" rx="18" fill="url(#cardTBg)" stroke="#FF4D6D" stroke-opacity="0.35" stroke-width="1.4" filter="url(#cShadowT)"/>
    <path d="M 20 1 L 420 1" stroke="#FFF0F3" stroke-opacity="0.25" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Badge -->
    <rect x="22" y="20" width="132" height="22" rx="11" fill="#3D1B2C" stroke="#E8A598" stroke-width="1" stroke-opacity="0.5"/>
    <text x="88" y="34.5" class="font-mono" font-size="10" font-weight="700" fill="#E8A598" text-anchor="middle">DATABASE LOGIC · 04</text>

    <!-- External Link Icon -->
    <text x="405" y="36" class="font-sans" font-size="16" font-weight="700" fill="#FF4D6D">↗</text>

    <!-- Title -->
    <text x="22" y="70" class="font-sans" font-size="24" font-weight="900" fill="#FFF0F3" letter-spacing="-0.5">Venue Turf Hub</text>
    <text x="22" y="92" class="font-sans" font-size="13" font-weight="600" fill="#E8A598">Geospatial Turf &amp; Court Booking</text>

    <!-- Description -->
    <text x="22" y="118" class="font-sans" font-size="11.5" font-weight="400" fill="#C9A8B6">
      Map-based turf discovery with automated slot scheduling.
    </text>
    <text x="22" y="136" class="font-sans" font-size="11.5" font-weight="400" fill="#C9A8B6">
      Postgres triggers enforce availability constraints directly in DB.
    </text>

    <!-- Stack Chips -->
    <g transform="translate(22, 160)">
      <rect width="66" height="22" rx="7" fill="#1B0C15" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.3"/>
      <text x="33" y="15" class="font-mono" font-size="9.5" font-weight="600" fill="#FFCCD5" text-anchor="middle">React 19</text>

      <rect x="74" y="0" width="70" height="22" rx="7" fill="#1B0C15" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.3"/>
      <text x="109" y="15" class="font-mono" font-size="9.5" font-weight="600" fill="#FFCCD5" text-anchor="middle">TanStack</text>

      <rect x="152" y="0" width="76" height="22" rx="7" fill="#1B0C15" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.3"/>
      <text x="190" y="15" class="font-mono" font-size="9.5" font-weight="600" fill="#FFCCD5" text-anchor="middle">Supabase</text>

      <rect x="236" y="0" width="60" height="22" rx="7" fill="#1B0C15" stroke="#FF4D6D" stroke-width="1" stroke-opacity="0.3"/>
      <text x="266" y="15" class="font-mono" font-size="9.5" font-weight="600" fill="#FFCCD5" text-anchor="middle">Leaflet</text>
    </g>
  </g>
</svg>